<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#367650">
<title>買い物メモ</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7f4,#151a17);--surface:light-dark(#fff,#202722);--text:light-dark(#202820,#f0f4f0);--muted:light-dark(#68756b,#aab6ac);--border:light-dark(#dfe6df,#39443b);--green:#367650;--green2:light-dark(#e3f1e7,#263d2e)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:600px;margin:0 auto;padding:14px 12px calc(22px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
h1{font-size:23px;letter-spacing:-.04em;margin:0}
.subtitle{font-size:14px;color:var(--muted);margin-top:5px}
.basket{font-size:30px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:12px;margin-bottom:15px}
label{font-weight:700;display:block;margin-bottom:8px}
.hint{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 12px}
textarea{width:100%;min-height:76px;resize:vertical;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.primary{width:100%;border:0;border-radius:11px;padding:11px 14px;background:var(--green);color:#fff;font-weight:750;margin-top:10px}
.status{font-size:13px;color:var(--muted);min-height:20px;margin:8px 0 0}
.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h2{font-size:19px;margin:0}
.count{font-size:13px;color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 9px;margin-top:6px;min-height:52px}
.check{width:36px;height:36px;flex:0 0 36px;border:0;border-radius:12px;background:var(--green2);color:light-dark(#286541,#a6e1b6);font-size:24px;font-weight:800}
.name{flex:1;overflow-wrap:anywhere;font-size:15px;line-height:1.35}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty .emoji{font-size:34px;margin-bottom:8px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.secondary{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 10px;font-size:12px}
.footer{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px}
dialog{max-width:calc(100% - 32px);width:420px;border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);padding:20px}
dialog::backdrop{background:#0008}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(min-width:520px){main{padding-top:22px}}
</style>
</head>
<body>
<main>
<header><div><h1>買い物メモ</h1><div class="subtitle">買うものだけ、サクッと管理。</div></div><div class="basket" aria-hidden="true">🛒</div></header>
<section class="panel">
<label for="bulk">📋 まとめて追加</label>
<p class="hint">メモやLINEからコピーして貼り付け。改行ごとに商品として登録されるよ。</p>
<textarea id="bulk" placeholder="牛乳&#10;卵&#10;食パン&#10;バナナ"></textarea>
<button class="primary" id="add">＋ リストに追加</button>
<p class="status" id="status" role="status" aria-live="polite"></p>
</section>
<section>
<div class="list-head"><h2>買うもの</h2><span class="count" id="count">0点</span></div>
<div id="items"></div>
<div id="empty" class="empty"><div class="emoji">🧺</div><strong>リストは空っぽ！</strong><div style="font-size:13px;margin-top:5px">買いたいものを追加してね。</div></div>
<div class="actions"><span class="count" id="saved">この端末に自動保存</span><button class="secondary" id="clear">全部クリア</button></div>
</section>
<p class="footer">✓ を押すと、その商品はすぐにリストから消えるよ。入力欄以外ではキーボード不要！<br>データはこのブラウザ内に保存されます。ブラウザのデータを消去すると、リストも消える場合があります。</p>
</main>
<dialog id="confirm"><strong>リストを全部クリアする？</strong><p class="hint" style="margin-top:10px">登録した商品がすべて削除されます。</p><div class="dialog-actions"><button class="secondary" id="cancel">キャンセル</button><button class="primary" style="width:auto;margin:0" id="confirmClear">全部クリア</button></div></dialog>
<script>
(() => {
 const $ = id => document.getElementById(id);
 const KEY = 'shopping-memo-items-v1';
 let list = [];
 try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => typeof x === 'string'); } catch {}
 function save(){ try { localStorage.setItem(KEY, JSON.stringify(list)); $('saved').textContent='保存済み ✓'; } catch { $('saved').textContent='このブラウザでは保存できません'; } }
 function render(){
   $('items').replaceChildren();
   $('empty').hidden = list.length > 0;
   $('count').textContent = `${list.length}点`;
   list.forEach((name, i) => {
     const row=document.createElement('div'); row.className='item';
     const btn=document.createElement('button'); btn.className='check'; btn.type='button'; btn.textContent='✓'; btn.setAttribute('aria-label', `${name}を削除`);
     btn.addEventListener('click',()=>{list.splice(i,1);save();render();$('status').textContent=`「${name}」を削除したよ！`;});
     const text=document.createElement('div'); text.className='name'; text.textContent=name;
     row.append(btn,text); $('items').append(row);
   });
 }
 $('add').addEventListener('click',()=>{
   const names=$('bulk').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
   if(!names.length){$('status').textContent='追加する商品を入力してね。';$('bulk').focus();return;}
   list.push(...names);save();render();$('bulk').value='';$('status').textContent=`${names.length}点追加したよ！`;
 });
 $('bulk').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();$('add').click();}});
 $('clear').addEventListener('click',()=>{if(!list.length){$('status').textContent='リストはすでに空だよ。';return;}$('confirm').showModal();});
 $('cancel').addEventListener('click',()=>$('confirm').close());
 $('confirmClear').addEventListener('click',()=>{list=[];save();render();$('confirm').close();$('status').textContent='リストを空にしたよ！';});
 render();
})();
</script>
</body>
</html>
